<!DOCTYPE html>
<html>
<head>
    <title>Goldfish Shop - SKU Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Goldfish Shop</h2>
        <div>
            <a href="index.html">SKU Generator</a>
            <a href="receipt.html">Register</a>
        </div>
    </nav>

    <main>
        <div class="box">
            <h1>Goldfish SKU Generator</h1>
            <p>Make a SKU for Ranchu, Oranda, and Lionhead goldfish.</p>

            <label>Goldfish Type</label>
            <select id="category">
                <option value="RAN">Ranchu</option>
                <option value="ORA">Oranda</option>
                <option value="LIO">Lionhead</option>
            </select>

            <label>Goldfish Name</label>
            <input id="product" type="text" placeholder="Example: Renelyn the Ranchu">
            <label>Stock Quantity</label>
            <input id="stock" type="number" placeholder="Example: 10">

            <button onclick="generateSKU()">Generate SKU</button>

            <div class="result">
                <h3>Your SKU</h3>
                <h2 id="result">---</h2>
            </div>
        </div>

        <div class="box">
            <h2>Our Goldfish</h2>
            <p>🐟 Ranchu — ₱1,500</p>
            <p>🐠 Oranda — ₱1,800</p>
            <p>🐟 Lionhead — ₱1,700</p>
        </div>
    </main>

    <footer>ICT 10 Project - Goldfish Shop</footer>

    <script>
        function generateSKU() {
            let category = document.getElementById("category").value;
            let product = document.getElementById("product").value;
            let stock = document.getElementById("stock").value;

            product = product.replaceAll(" ", "").toUpperCase();

            if (product === "" || stock === "") {
                document.getElementById("result").textContent = "Fill in all fields";
                return;
            }

            let sku = category + "-" + product.substring(0, 3) + "-" + stock;
            document.getElementById("result").textContent = sku;
        }
    </script>
</body>
</html>
